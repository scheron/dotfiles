onboarding = false
# herdr configuration — managed in ~/.dotfiles/herdr/config.toml
# Reload:  herdr server reload-config   (or prefix+shift+r inside Herdr)
# Check:   herdr config check
# Prefix is ctrl+g (see [keys]); "prefix+x" below means: press ctrl+g, then x.

[theme]
name = "tokyo-night"          # matches nvim (tokyonight), dark

[terminal]
new_cwd = "follow"            # new panes inherit the source pane/workspace cwd

[keys]
prefix = "ctrl+g"             # aerospace owns alt-*/cmd-* → prefix stays on ctrl, no conflicts
open_worktree = "prefix+shift+o" # switch to an EXISTING worktree (I don't create by hand; use `herdr worktree create` if ever needed)
goto = "prefix+m"                # moved off default prefix+g (freed for lazygit below)
toggle_sidebar = "prefix+e"      # sidebar toggle, moved off default prefix+b (freed for agents below)
edit_scrollback = ""             # disabled — frees prefix+e for the sidebar toggle above
next_agent = "prefix+b"          # jump to next agent (1st press → top of priority-sorted list), wraps
previous_agent = "prefix+shift+b" # jump to previous agent (step back up the list)
detach = ""                      # disabled — unused, avoid accidental session detach
resize_mode = ""                 # disabled — frees prefix+r for the nvim popup below
new_tab = "prefix+t"             # moved off default prefix+c, matches new_workspace naming below
close_tab = "prefix+shift+q"     # moved off default prefix+shift+x
next_tab = ""                    # disabled — unused
previous_tab = ""                # disabled — unused
new_workspace = "prefix+n"       # moved off default prefix+shift+n, frees shift+n for rename below
rename_workspace = "prefix+shift+n" # moved off default prefix+shift+w
# Everything else keeps Herdr's vim-flavored defaults:
#   panes  prefix+h/j/k/l   splits  prefix+v (vert) / prefix+- (horiz)
#   tabs   prefix+shift+t rename · prefix+1..9 switch · zoom prefix+z

# The popup overlays the current pane rather than resizing it. width/height
# take a cell count or a 1%-100% percentage and are popup-only fields.
[[keys.command]]              # g for git: the full lazygit UI
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "Git UI (lazygit)"
width = "90%"
height = "90%"

[[keys.command]]              # r for read/edit: nvim over the current pane
key = "prefix+r"
type = "popup"
command = "nvim"
description = "Editor (nvim)"
width = "90%"
height = "90%"

# Not a popup: reviewr is a herdr plugin, so it opens as a plugin-owned pane
# (split to the right by default) and width/height do not apply.
[[keys.command]]              # d for diff: toggle the reviewr sidebar
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Review changes in reviewr"

# Same story: herdr-nvim declares its sidebar pane as placement = "split", so
# this can only ever be a full-height split — the popup above is a plain nvim.
[[keys.command]]              # shift+e: the nvim sidebar, next to prefix+e
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[ui]
accent = "#7aa2f7"            # tokyo-night blue for borders/highlights/nav
agent_panel_sort = "priority" # attention queue: blocked/done agents float to the top
sidebar_start_collapsed = false   # sidebar visible on launch; prefix+e toggles it
prompt_new_workspace_name = true  # prefix+n asks for a name instead of auto-generating one

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "off"             # no toast notifications (was "system"; other values: herdr=in-app, terminal)

[ui.sound]
enabled = true               # audible cue on agent state changes in background workspaces

[session]
resume_agents_on_restore = true  # resume claude/codex into their sessions after a server restart

[experimental]
# During prefix mode, temporarily switch macOS input source to ASCII so
# prefix+letter commands register even when a Cyrillic layout is active.
switch_ascii_input_source_in_prefix = true
